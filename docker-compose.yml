services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env

  backend:
    image: artem0693/foodgram_backend:latest
    volumes:
      - static_volume:/app/staticfiles/
      - media_volume:/app/media/
    env_file: .env
    depends_on:
      - db

  frontend:
    image: artem0693/foodgram_frontend:latest

  nginx:
    image: nginx:1.25.4-alpine
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/foodgram.conf:ro
    depends_on:
      - frontend

volumes:
  frontend_build:
  postgres_data:
  static_volume:
  media_volume:
services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env
    restart: always

  backend:
    image: artem0693/foodgram_backend:latest
    volumes:
      - static_volume:/app/staticfiles/
      - media_volume:/app/media/
    env_file: .env
    depends_on:
      - db
    restart: always

  frontend:
    image: artem0693/foodgram_frontend:latest
    volumes:
      - static_volume:/var/html/static/

  nginx:
    image: nginx:1.25.4-alpine
    ports:
      - "8000:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docs/:/usr/share/nginx/html/api/docs/:ro
      - static_volume:/staticfiles/:ro
      - media_volume:/media/:ro
    depends_on:
      - backend
      - frontend
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume:

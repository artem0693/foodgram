services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env

  backend:
    image: artem0693/foodgram_backend:latest
    volumes:
      - static_volume:/app/staticfiles/
      - media_volume:/app/media/
    env_file: .env
    depends_on:
      - db

  frontend:
    image: artem0693/foodgram_frontend:latest
    volumes:
      - frontend_build:/app/result/
    entrypoint: ["cp", "-r", "/app/result/.", "/app/result/"]

  nginx:
    image: nginx:1.25.4-alpine
    ports:
      - "8070:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/foodgram.conf:ro
      - frontend_build:/usr/share/nginx/html/
      - static_volume:/var/html/static/
      - media_volume:/var/html/media/
      - ./docs:/usr/share/nginx/html/api/docs/
    depends_on:
      - backend
      - frontend

volumes:
  frontend_build:
  postgres_data:
  static_volume:
  media_volume: